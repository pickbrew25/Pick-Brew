<script>
/* v7.1.2 FIX: this is the dashboard's one remote dependency and there was no
   guard on it. A blocked CDN or a shop with flaky internet meant "Chart is
   not defined" thrown out of a setTimeout and blank boxes with no
   explanation. Every figure on the page is computed locally, so the tables
   and totals are unaffected — only the drawing fails. */
if(typeof Chart==='undefined'){
  window.Chart=function(ctx){
    try{
      var w=ctx&&ctx.parentNode;
      if(w)w.innerHTML='<div style="display:flex;align-items:center;justify-content:center;'
        +'height:100%;padding:18px;text-align:center;font-size:13px;line-height:1.6;color:var(--t2)">'
        +'Charts need an internet connection.<br>All figures on this page are still live.</div>';
    }catch(e){}
    this.destroy=function(){};this.update=function(){};this.resize=function(){};
  };
}
</script>
<style>
/* ==========================================================================
   ARROYO POS — DASHBOARD: "CARBON COPY"
   The counter app is a receipt book; this is the ledger it gets posted into.
   Same ink, same keylines, same condensed figures — but denser, because the
   job here is comparison rather than tapping. No cards: sections are boxed by
   rules, and rows are ruled lines in a column.
   ========================================================================== */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#edebe3;        /* manila page */
  --bg1:#faf9f4;       /* sheet: sidebar, boxed sections */
  --bg2:#ffffff;       /* a cell you can write in */
  --bg3:#dfdcd1;       /* pressed, chips, carbon smudge */
  --t1:#000000;
  --t2:#3a3a33;
  --t3:#5c5c54;
  --b1:rgba(0,0,0,0.20);   /* hairline: row rules only */
  --b2:#000000;            /* keyline: the structural line */
  --ac:#1b3a8c;            /* carbon blue, replaced by the brand at runtime */
  --ac2:#e4e8f4;
  --sg:#ddebdf;--st:#1f6b3a;
  --wg:#f5e6c8;--wt:#7a4e10;
  --dg:#fcebe9;--dt:#c8241c;
  --pg:#e3e0f0;--pt:#3e3577;
  --gold:#7a4e10;
  --navy:#1b3a8c;
  --keyline:2px;
  --sbw:232px;
  --f-num:'Roboto Condensed','Avenir Next Condensed','HelveticaNeue-CondensedBold','Helvetica Neue Condensed','Arial Narrow',system-ui,sans-serif;
  --f-ser:ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,monospace;
  --carbon:4px 4px 0 #000;
  --ease:cubic-bezier(.2,.8,.3,1);
}
html,body{min-height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--t1);font-size:14px}

/* Figures are condensed and tabular so a column of money reads as a column. */
.stat-v,.top-val,.att-hours,.shift-hrs,.emp-hist-hrs,.payslip-row span:last-child{
  font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.01em}
.tbl td,.payslip-row,.emp-hist-date,.emp-hist-times,.shift-time-in,.shift-time-out,
.att-time-block,.emp-pay,.emp-pay2,.shift-pill,.mobile-biz{font-variant-numeric:tabular-nums}

/* ---- MOBILE CHROME --------------------------------------------------- */
.mobile-topbar{display:none;position:fixed;top:0;left:0;right:0;height:54px;background:var(--bg1);border-bottom:var(--keyline) solid var(--b2);z-index:150;align-items:center;padding:0 14px;gap:12px}
.hamburger{display:none;background:transparent;border:1.5px solid var(--b2);color:var(--t1);font-size:18px;cursor:pointer;width:44px;height:44px;align-items:center;justify-content:center;flex-shrink:0;border-radius:0}
.hamburger:hover{background:var(--t1,#000);color:var(--bg,#edebe3)}
.mobile-title{font-size:15px;font-weight:800;letter-spacing:-.02em;flex:1}
.mobile-biz{font-size:11px;color:var(--t2)}
.sidebar-overlay{display:none}
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--bg1);border-top:var(--keyline) solid var(--b2);z-index:150;justify-content:space-around;align-items:center;padding:0}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 8px;cursor:pointer;border-radius:0;min-width:46px;border:none;border-right:1px solid var(--b1);background:none;color:var(--t3);flex:1;height:100%;justify-content:center;transition:background .12s var(--ease)}
.bnav-item:last-child{border-right:none}
.bnav-item.active{background:var(--t1);color:var(--bg)}
.bnav-item i{font-size:19px}
.bnav-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
@media(max-width:768px){.main{padding-top:66px}}

/* ---- SIGN IN --------------------------------------------------------- */
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.auth-card{background:var(--bg1);border:var(--keyline) solid var(--b2);border-radius:0;padding:32px 28px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--carbon)}
.auth-ico{width:44px;height:44px;border-radius:0;border:1.5px solid var(--b2);background:var(--ac);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff}
.auth-field{display:flex;flex-direction:column;gap:6px}
.auth-field label{font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.06em}
.auth-field input{padding:12px 14px;border-radius:0;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t1);font-size:14.5px;outline:none;width:100%;min-height:46px;transition:box-shadow .15s var(--ease)}
.auth-field input:focus{box-shadow:3px 3px 0 #000}
.auth-btn{padding:14px;border-radius:0;border:var(--keyline) solid var(--b2);background:var(--ac);color:#fff;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;min-height:50px;box-shadow:3px 3px 0 #000;transition:transform .1s var(--ease),box-shadow .1s var(--ease)}
.auth-btn:hover{filter:brightness(1.1)}
.auth-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.auth-btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.auth-err{font-size:13px;color:var(--dt);min-height:18px;text-align:center;font-weight:700}

/* ---- SHELL ----------------------------------------------------------- */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sbw);background:var(--bg1,#faf9f4);border-right:var(--keyline) solid var(--b2,#000);display:flex;flex-direction:column;position:fixed;height:100vh;z-index:100;overflow-y:auto}
.sb-brand{padding:16px 18px;border-bottom:var(--keyline) solid var(--b2);display:flex;align-items:center;gap:10px}
.sb-ico{width:32px;height:32px;border-radius:0;border:1.5px solid var(--b2);background:var(--ac);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0}
.sb-name{font-size:14.5px;font-weight:800;color:var(--t1);letter-spacing:-.02em}
.sb-biz{font-size:11px;color:var(--t2)}
.nav{flex:1;padding:0;display:flex;flex-direction:column;gap:0}
/* Nav items are ruled rows, not floating pills. */
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 18px;border-radius:0;cursor:pointer;color:var(--t2);font-size:13.5px;font-weight:600;border:none;border-bottom:1px solid var(--b1);background:none;width:100%;text-align:left;transition:background .12s var(--ease),color .12s var(--ease)}
.nav-item:hover{background:var(--bg3);color:var(--t1)}
.nav-item.active{background:var(--t1);color:var(--bg);font-weight:800}
.nav-item i{font-size:16px;flex-shrink:0}
.nav-section{font-size:10px;font-weight:800;color:var(--t2);text-transform:uppercase;letter-spacing:.1em;padding:14px 18px 6px;background:var(--bg3);border-bottom:1px solid var(--b1)}
.sb-foot{padding:12px;border-top:var(--keyline) solid var(--b2)}
.user-email{font-family:var(--f-ser);font-size:11px;color:var(--t2);padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.so-btn{padding:9px 11px;border-radius:0;border:1.5px solid var(--b2);background:transparent;color:var(--t2);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;width:100%;text-align:left;transition:all .12s var(--ease)}
.so-btn:hover{color:#fff;background:var(--dt);border-color:var(--dt)}
.main{margin-left:var(--sbw);flex:1;padding:26px 28px;min-height:100vh;background:var(--bg)}

/* The page title is a masthead with a heavy rule under it. */
.page-title{font-size:26px;font-weight:800;margin-bottom:18px;color:var(--t1);letter-spacing:-.035em;border-bottom:var(--keyline) solid var(--b2);padding-bottom:8px}

/* ---- FIGURE BOXES ---------------------------------------------------- */
/* Stats share edges so the row reads as one ruled band of figures. */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0;margin-bottom:20px;border-left:1.5px solid var(--b2)}
.stat{background:var(--bg2,#fff);border:1.5px solid var(--b2,#000);border-left-width:0;border-radius:0;padding:14px 16px;transition:background .15s var(--ease)}
.stat:hover{background:var(--bg1)}
.stat-l{font-size:10.5px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.stat-v{font-size:30px;letter-spacing:-.03em;line-height:1.05}
.stat-s{font-size:11.5px;color:var(--t3);margin-top:4px}
.stat.blue .stat-v{color:var(--ac)}
.stat.green .stat-v{color:var(--st)}
.stat.red .stat-v{color:var(--dt)}
.stat.amber .stat-v{color:var(--wt)}

/* ---- BOXED SECTIONS -------------------------------------------------- */
.card{background:var(--bg1,#faf9f4);border:1.5px solid var(--b2,#000);border-radius:0;padding:0;margin-bottom:16px}
/* The section head is a title bar with a rule, like a form's caption row. */
.card-hd{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;margin:0;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--t1);background:var(--bg3);border-bottom:1.5px solid var(--b2)}
.card-hd span{font-size:11px;font-weight:600;color:var(--t2);text-transform:none;letter-spacing:0}
.card>*:not(.card-hd){margin-left:16px;margin-right:16px}
.card>.card-hd+*{margin-top:14px}
.card>*:last-child{margin-bottom:16px}
.chart-wrap{position:relative;height:230px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}

/* ---- LEDGER TABLES --------------------------------------------------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:10.5px;font-weight:800;color:var(--t2);text-transform:uppercase;letter-spacing:.08em;padding:0 8px 9px 0;text-align:left;border-bottom:1.5px solid var(--b2)}
.tbl td{padding:10px 8px 10px 0;border-bottom:1px solid var(--b1);color:var(--t2)}
.tbl td:first-child{color:var(--t1);font-weight:600;font-family:var(--f-ser);font-size:12.5px}
.tbl td:last-child,.tbl th:last-child{text-align:right;padding-right:0}
.tbl tr:last-child td{border-bottom:none}
.row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--b1);gap:12px}
.row:last-child{border-bottom:none}
.row-l{flex:1;min-width:0}
.row-name{font-size:14px;font-weight:650;color:var(--t1)}
.row-sub{font-size:12px;color:var(--t3);margin-top:2px}
.row-r{display:flex;align-items:center;gap:8px;flex-shrink:0}

/* ---- STAMPS ---------------------------------------------------------- */
/* One shape for every state marker: rectangular, tracked, ruled. */
.badge,.att-active-badge{display:inline-block;padding:3px 7px;border-radius:0;border:1px solid currentColor;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.b-green{background:var(--sg);color:var(--st)}
.b-blue{background:var(--ac2);color:var(--ac)}
.b-red{background:var(--dg);color:var(--dt)}
.b-amber{background:var(--wg);color:var(--wt)}
.b-gray{background:var(--bg3);color:var(--t2)}
.b-purple{background:var(--pg);color:var(--pt)}

/* ---- FILTERS + STATES ------------------------------------------------ */
.filter-bar{display:flex;gap:0;margin-bottom:16px;flex-wrap:wrap}
.fp{padding:8px 15px;border-radius:0;border:1.5px solid var(--b2);border-right-width:0;background:var(--bg2);color:var(--t2);font-size:12.5px;font-weight:700;cursor:pointer;min-height:38px;transition:all .12s var(--ease)}
.fp:last-child{border-right-width:1.5px}
.fp:hover{background:var(--bg3);color:var(--t1)}
.fp.on{background:var(--t1);color:var(--bg);border-color:var(--b2)}
.loading{display:flex;align-items:center;justify-content:center;height:200px;color:var(--t2);font-size:13px;gap:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.spin{width:18px;height:18px;border:2px solid var(--b1);border-top-color:var(--t1);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* An empty section is an invitation, set on a dashed rule like a blank form. */
.empty{text-align:center;padding:36px 20px;color:var(--t3);font-size:13.5px;line-height:1.7;border:1px dashed var(--b1)}
.add-btn{padding:8px 14px;border-radius:0;border:1.5px solid var(--b2);background:var(--ac);color:#fff;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;min-height:36px;transition:filter .12s var(--ease)}
.add-btn:hover{filter:brightness(1.12)}

/* ---- RANKED ROWS ----------------------------------------------------- */
/* Ranks are a genuine sequence, so the numbered marker earns its place. */
.top-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--b1)}
.top-item:last-child{border-bottom:none}
.top-rank{width:24px;height:24px;border-radius:0;background:var(--t1);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;flex-shrink:0;font-variant-numeric:tabular-nums}
.top-info{flex:1;min-width:0}
.top-name{font-size:14px;font-weight:650;color:var(--t1)}
.top-sub{font-size:12px;color:var(--t3);margin-top:2px}
.top-val{font-size:17px;color:var(--t1)}

/* ---- EMPLOYEES (legacy rows) ---------------------------------------- */
.emp-card{background:var(--bg2);border-radius:0;padding:14px;display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:0;border:1.5px solid var(--b2);border-bottom-width:0}
.emp-card:last-of-type{border-bottom-width:1.5px}
.emp-av{width:38px;height:38px;border-radius:0;background:var(--ac2);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--ac);flex-shrink:0;border:1.5px solid var(--b2)}
.emp-info{flex:1;min-width:0}
.emp-name{font-size:14px;font-weight:700;color:var(--t1)}
.emp-role{font-size:12px;color:var(--t3);margin-top:2px}
.emp-pay{font-size:12px;color:var(--t2);margin-top:4px}
.emp-btns{display:flex;gap:0;flex-wrap:wrap;margin-top:6px}
.sm-btn{padding:6px 11px;border-radius:0;border:1.5px solid var(--b2);border-right-width:0;background:var(--bg2);color:var(--t2);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;min-height:32px;transition:all .12s var(--ease)}
.sm-btn:last-child{border-right-width:1.5px}
.sm-btn:hover{background:var(--t1);color:var(--bg)}
.payslip-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--b1);font-size:13px;color:var(--t2)}
/* The net figure closes the slip between two rules. */
.payslip-row:last-child{border-bottom:none;font-weight:800;font-size:20px;color:var(--st);padding-top:11px;margin-top:4px;border-top:var(--keyline) solid var(--b2);font-family:var(--f-num);letter-spacing:-.02em}

/* ---- MODALS ---------------------------------------------------------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg1);border-radius:0;border-top:var(--keyline) solid var(--b2);width:100%;max-width:480px;padding:22px;display:flex;flex-direction:column;gap:13px;max-height:88vh;overflow-y:auto}
@media(min-width:640px){.ov{align-items:center}.modal{border:var(--keyline) solid var(--b2);box-shadow:6px 6px 0 #000}}
.modal-title{font-size:20px;font-weight:800;color:var(--t1);letter-spacing:-.025em;border-bottom:1.5px solid var(--b2);padding-bottom:9px}
.mf{display:flex;flex-direction:column;gap:6px}
.mf label{font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.06em}
.mf input,.mf select,.mf textarea{padding:11px 12px;border-radius:0;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t1);font-size:14.5px;outline:none;width:100%;min-height:44px;transition:box-shadow .15s var(--ease)}
.mf input:focus,.mf select:focus,.mf textarea:focus{box-shadow:3px 3px 0 #000}
.mf textarea{min-height:74px;resize:vertical;font-family:inherit}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;padding-top:13px;border-top:1.5px solid var(--b2)}
.modal-btns button{padding:11px 16px;border-radius:0;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t1);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;min-height:44px;transition:all .12s var(--ease)}
.modal-btns button:hover{background:var(--bg3)}
.modal-btns .pri{background:var(--t1);color:var(--bg);border-color:var(--b2);box-shadow:3px 3px 0 #000}
.modal-btns .pri:hover{background:var(--t1);filter:brightness(1.3)}
.modal-btns .pri:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.modal-btns .del{color:var(--dt);margin-right:auto;border-color:var(--dt);background:transparent}
.modal-btns .del:hover{background:var(--dt);color:#fff}

/* ---- RESPONSIVE ------------------------------------------------------ */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);transition:transform .28s var(--ease);position:fixed;height:100vh;z-index:200;box-shadow:6px 0 0 rgba(0,0,0,.25)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay{display:block!important;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:199;opacity:0;pointer-events:none;transition:opacity .28s var(--ease)}
  .sidebar-overlay.open{opacity:1;pointer-events:all}
  .main{margin-left:0;padding:14px;padding-bottom:74px}
  .two-col{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:1fr 1fr}
  .page-title{font-size:21px;margin-bottom:14px}
  .card{margin-bottom:14px}
  .card>*:not(.card-hd){margin-left:13px;margin-right:13px}
  .card>*:last-child{margin-bottom:13px}
  .tbl{font-size:12.5px}
  .tbl th{font-size:9.5px;padding:0 6px 8px 0}
  .tbl td{padding:9px 6px 9px 0}
  .stat{padding:12px 13px}
  .stat-v{font-size:25px}
  .stat-l{font-size:10px}
  .emp-card,.emp-btns{flex-wrap:wrap}
  .fp{padding:7px 12px;font-size:11.5px}
  .row-name{font-size:13.5px}
  .row-sub{font-size:11.5px}
  .bottom-nav{display:flex!important}
  .hamburger{display:flex!important}
  .mobile-topbar{display:flex!important}
  /* The back office is mostly a laptop tool, so these stay compact on desktop.
     On a phone they become real touch targets. */
  .fp,.att-tab,.add-btn,.sm-btn{min-height:44px}
}

/* ---- EMPLOYEES + ATTENDANCE ----------------------------------------- */
.emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:0;margin-bottom:0;border-left:1.5px solid var(--b2);border-top:1.5px solid var(--b2)}
.emp-card2{background:var(--bg2,#fff);border:1.5px solid var(--b2,#000);border-radius:0;margin:0 -1.5px -1.5px 0;padding:15px;display:flex;flex-direction:column;gap:11px;transition:background .12s var(--ease)}
.emp-card2:hover{background:var(--bg1)}
.emp-head{display:flex;align-items:center;gap:12px}
.emp-av2{width:42px;height:42px;border-radius:0;background:var(--ac2);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:var(--ac);flex-shrink:0;border:1.5px solid var(--b2)}
.emp-meta{flex:1;min-width:0}
.emp-name2{font-size:14.5px;font-weight:800;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.015em}
.emp-role2{display:flex;align-items:center;gap:6px;margin-top:3px}
.emp-status-dot{width:8px;height:8px;border-radius:0;flex-shrink:0}
.emp-status-dot.in{background:var(--st)}
.emp-status-dot.out{background:var(--t3)}
.emp-pay2{font-size:11px;color:var(--t2);padding:3px 8px;background:transparent;border-radius:0;border:1px solid var(--b1);white-space:nowrap}
.emp-actions{display:flex;gap:0;flex-wrap:wrap}
.emp-actions .sm-btn{flex:1;min-width:60px;text-align:center;justify-content:center}
.att-day-group{margin-bottom:16px}
/* A date is a heading with a rule running off it. */
.att-day-label{font-size:11px;font-weight:800;color:var(--t1);text-transform:uppercase;letter-spacing:.09em;padding:4px 0 8px;display:flex;align-items:center;gap:10px}
.att-day-label::after{content:'';flex:1;height:1.5px;background:var(--b2)}
.att-row2{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--bg2);border-radius:0;margin-bottom:0;border:1.5px solid var(--b2);border-bottom-width:0}
.att-row2:last-child{border-bottom-width:1.5px}
.att-avatar{width:30px;height:30px;border-radius:0;background:var(--ac2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--ac);flex-shrink:0;border:1px solid var(--b2)}
.att-info{flex:1;min-width:0}
.att-name2{font-size:13.5px;font-weight:700;color:var(--t1)}
.att-times{display:flex;align-items:center;gap:8px;margin-top:3px;flex-wrap:wrap}
.att-time-block{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--t2)}
.att-time-block i{font-size:11px}
.att-arrow{color:var(--t3);font-size:10px}
.att-active-badge{background:var(--sg);color:var(--st)}
.att-hours{font-size:17px;color:var(--t1);white-space:nowrap;flex-shrink:0}
.att-hours.active{color:var(--st)}
@media(max-width:768px){.emp-grid{grid-template-columns:1fr}}

/* ---- TODAY'S SHIFTS -------------------------------------------------- */
.shift-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;flex-wrap:wrap;gap:8px}
.shift-date{font-size:11px;color:var(--t2);font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.shift-summary{display:flex;gap:0;flex-wrap:wrap;margin-bottom:14px}
.shift-pill{padding:7px 13px;border-radius:0;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:7px;border:1.5px solid var(--b2);border-right-width:0}
.shift-pill:last-child{border-right-width:1.5px}
.shift-pill.in{background:var(--sg);color:var(--st)}
.shift-pill.out{background:var(--bg3);color:var(--t2)}
.shift-pill.total{background:var(--ac2);color:var(--ac)}
.shift-dot{width:8px;height:8px;border-radius:0;background:currentColor}
.shift-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg2);border-radius:0;margin-bottom:0;border:1.5px solid var(--b2);border-bottom-width:0;transition:background .12s var(--ease)}

(function(){
  /* The client's brand colour is applied as the accent, but on light surfaces
     it is used BOTH as a fill under white text (buttons, avatars) and as text
     on white (stat figures). A raw bright brand colour fails one or both, so
     it is walked darker until it clears 4.5:1 against white — which satisfies
     both directions at once — and a 94%-light tint of the same hue is derived
     for the chip grounds. */
  if(typeof DASH_PREFILL==='undefined')return;
  var raw=DASH_PREFILL.themeColor;
  if(!raw||!/^#[0-9a-fA-F]{6}$/.test(raw))return;
  var R=parseInt(raw.slice(1,3),16),G=parseInt(raw.slice(3,5),16),B=parseInt(raw.slice(5,7),16);
  var mx=Math.max(R,G,B)/255,mn=Math.min(R,G,B)/255,d=mx-mn;
  var H=0,S=0,L=(mx+mn)/2;
  if(d){
    S=L>0.5?d/(2-mx-mn):d/(mx+mn);
    var rr=R/255,gg=G/255,bb=B/255;
    H=(mx===rr)?((gg-bb)/d+(gg<bb?6:0)):(mx===gg)?((bb-rr)/d+2):((rr-gg)/d+4);
    H/=6;
  }
  function hsl(h,sa,li){
    sa=Math.max(0,Math.min(1,sa));li=Math.max(0,Math.min(1,li));
    function f(n){var k=(n+h*12)%12;return li-sa*Math.min(li,1-li)*Math.max(-1,Math.min(Math.min(k-3,9-k),1));}
    function to(v){return Math.round(v*255).toString(16).padStart(2,'0');}
    return '#'+to(f(0))+to(f(8))+to(f(4));
  }
  function lin(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);}
  function onWhite(c){
    var v=[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
    return 1.05/((0.2126*lin(v[0])+0.7152*lin(v[1])+0.0722*lin(v[2]))+0.05);
  }
  var ac,ac2;
  if(S>=0.08){
    var acS=Math.max(S,0.32),acL=Math.min(0.44,Math.max(0.24,L));
    ac=hsl(H,acS,acL);
    var g=0;
    while(onWhite(ac)<5.2&&acL>0.13&&g++<48){acL-=0.015;ac=hsl(H,acS,acL);}
    ac2=hsl(H,Math.min(Math.max(S,0.22),0.60),0.94);
  }else{
    ac='#1b3a8c';ac2='#e4e8f4';
  }
  var st=document.createElement('style');
  st.textContent=':root{--ac:'+ac+' !important;--ac2:'+ac2+' !important}';
  document.head.appendChild(st);
  var m=document.createElement('meta');m.name='theme-color';m.content='#edebe3';
  document.head.appendChild(m);
})();
/* Charts read the resolved accent from the cascade rather than hardcoding a
   colour, so a rebranded deploy recolours its graphs for free. */
function CHART_INK(){
  var v=getComputedStyle(document.documentElement).getPropertyValue('--ac').trim();
  return v||'#2e2e33';
}
function CHART_FILL(){
  var h=CHART_INK().replace('#','');
  if(h.length!==6)return 'rgba(46,46,51,0.85)';
  return 'rgba('+parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','+parseInt(h.slice(4,6),16)+',0.9)';
}
let D={sales:[],expenses:[],products:[],employees:[],attendance:[],customers:[],credit:[],suppliers:[],pos:[],ingredients:[],recipes:[],wastage:[],orders:[],loans:[],leaves:[],shifts:[]};
let UI={page:'overview',filter:'week',modal:null,loading:false};
let CHARTS={};

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e;}
/* Operator-supplied text (product names, employee names, notes, categories)
   is written into innerHTML all over this file. The POS lets staff type those
   values, so an item named  <img src=x onerror=...>  would execute here — in
   the one place holding the Supabase credentials. Escaping at the API boundary
   was the wrong fix: the same records populate edit forms, where entities would
   show up literally as &amp;. So it is escaped at the render sites instead. */
function esc(v){
  return String(v==null?'':v).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmt(n){return'PHP '+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fd(d){return new Date(d).toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'});}
function ft(d){return new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
/* cost_per_unit is the column this dashboard writes. Older POS builds wrote a
   plain `cost` instead, so read either and never return undefined — an
   undefined here turned every COGS and margin figure into NaN. */
function ingCost(ing){
  if(!ing)return 0;
  const v=(ing.cost_per_unit!=null)?ing.cost_per_unit:ing.cost;
  return Number(v)||0;
}
function ingLow(ing){
  if(!ing)return 0;
  const v=(ing.low_threshold!=null)?ing.low_threshold:ing.low;
  return Number(v)||0;
}

/* api() lives further down, next to refreshDashSession(), because it needs
   to retry on 401. There used to be a second, non-retrying copy right here;
   because both were function declarations in the same scope the later one
   hoisted over this one from the very first line, so this copy never ran and
   any edit made to it was silently discarded. */
function authErrText(res,fallback){
  /* GoTrue answers in several shapes depending on version and endpoint:
       {error:'invalid_grant', error_description:'Invalid login credentials'}
       {code:400, msg:'Invalid login credentials', error_code:'invalid_credentials'}
       {error:{message:'...'}}   {message:'...'}
     Reading only res.error.message meant a string error silently became
     the useless generic line. */
  if(!res)return fallback;
  var m=(res.error&&res.error.message)||res.error_description||res.msg||res.message||
        (typeof res.error==='string'?res.error:'')||'';
  var code=String(res.error_code||res.code||res.error||'');
  if(/email_not_confirmed|not confirmed/i.test(m+code))
    return 'This email has not been confirmed yet. Open the confirmation link Supabase sent, or turn off email confirmation in Supabase \u2192 Authentication \u2192 Providers.';
  if(/invalid[_ ]?(login|grant|credentials)/i.test(m+code))
    return 'Wrong email or password. This is the account created on the POS \u2014 not the admin password.';
  return m||fallback;
}
async function signIn(email,pw){
  try{const r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});return await r.json();}
  catch(e){return{error:{message:'Network error'}};}
}
async function signOut(){
  try{await fetch(SB_URL+'/auth/v1/logout',{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SESSION.token}});}catch(e){}
  // Same shape as the initial literal — a partial reset left a stale refresh
  // token and settings object hanging off SESSION after sign out.
  SESSION={token:null,refresh:null,user:null,bizId:null,bizName:'',email:'',settings:{}};
  localStorage.removeItem('apos_dash');render();
}
function saveSession(){localStorage.setItem('apos_dash',JSON.stringify(SESSION));}
function loadSession(){try{const s=JSON.parse(localStorage.getItem('apos_dash')||'{}');if(s.token){SESSION=s;if(!SESSION.settings)SESSION.settings={};return true;}}catch(e){}return false;}

let _loadDataBusy=false;
let _loadDataTimer=null;
async function loadData(){
  if(!SESSION.token){
    console.warn('[ArroyoDash] loadData skipped - no token');
    return;
  }
  if(_loadDataBusy){
    console.warn('[ArroyoDash] loadData already running — skipping duplicate call');
    return;
  }
  if(_loadDataTimer){
    console.warn('[ArroyoDash] loadData debounced — too soon after last run');
    return;
  }
  _loadDataBusy=true;
  // Set a cooldown immediately so any calls that arrive during or shortly after are dropped
  _loadDataTimer=setTimeout(function(){_loadDataTimer=null;},1500);
  // Always verify and auto-correct bizId from Supabase — no logout needed
  try{
    const h={'apikey':SB_KEY,'Authorization':'Bearer '+SESSION.token,'Content-Type':'application/json'};
    // Step 1: check POS localStorage for bizId (same browser, most reliable)
    try{
      const posCloud=JSON.parse(localStorage.getItem('arroyo_cloud')||'{}');
      if(posCloud&&posCloud.bizId&&posCloud.bizId!==SESSION.bizId){
        console.log('[ArroyoDash] Auto-correcting bizId from POS localStorage:',posCloud.bizId);
        SESSION.bizId=posCloud.bizId;saveSession();
      }
    }catch(e){}
    // Step 2: always fetch correct bizId from Supabase to catch cross-device mismatches
    const bizRes=await fetch(SB_URL+'/rest/v1/businesses?user_id=eq.'+SESSION.user+'&order=created_at.asc&limit=1',{headers:h});
    if(bizRes.ok){
      const bizData=await bizRes.json();
      if(bizData&&bizData[0]){
        if(bizData[0].id!==SESSION.bizId){
          console.log('[ArroyoDash] Auto-correcting bizId from Supabase:',bizData[0].id,'was:',SESSION.bizId);
          SESSION.bizId=bizData[0].id;
          SESSION.bizName=bizData[0].name;
          saveSession();
        }
      }
    }
  }catch(e){console.warn('[ArroyoDash] bizId check failed:',e);}
  if(!SESSION.bizId){
    console.warn('[ArroyoDash] loadData skipped - no bizId after correction');
    _loadDataBusy=false;
    return;
  }
  UI.loading=true;render();
  updateSyncStatus('syncing');
  const bid=SESSION.bizId;
  console.log('[ArroyoDash] loadData started for bizId:',bid);
  const results=await Promise.all([
    api('/rest/v1/sales?biz_id=eq.'+bid+'&order=date.desc&limit=1000'),
    api('/rest/v1/expenses?biz_id=eq.'+bid+'&order=date.desc&limit=500'),
    api('/rest/v1/products?biz_id=eq.'+bid),
    api('/rest/v1/employees?biz_id=eq.'+bid+'&active=eq.true&order=name'),
    api('/rest/v1/attendance?biz_id=eq.'+bid+'&order=time_in.desc&limit=500'),
    api('/rest/v1/customers?biz_id=eq.'+bid+'&order=name'),
    api('/rest/v1/credit_ledger?biz_id=eq.'+bid+'&order=date.desc&limit=300'),
    api('/rest/v1/suppliers?biz_id=eq.'+bid+'&order=name'),
    api('/rest/v1/purchase_orders?biz_id=eq.'+bid+'&order=date.desc&limit=200'),
    api('/rest/v1/ingredients?biz_id=eq.'+bid+'&order=name'),
    api('/rest/v1/recipes?biz_id=eq.'+bid),
    api('/rest/v1/wastage?biz_id=eq.'+bid+'&order=date.desc&limit=200'),
    api('/rest/v1/orders?biz_id=eq.'+bid+'&order=created_at.desc&limit=200'),
    api('/rest/v1/employee_loans?biz_id=eq.'+bid+'&order=date.desc'),
    api('/rest/v1/leaves?biz_id=eq.'+bid+'&order=created_at.desc'),
    api('/rest/v1/shifts?biz_id=eq.'+bid+'&order=started_at.desc&limit=300'),
  ]);
  const keys=['sales','expenses','products','employees','attendance','customers','credit','suppliers','pos','ingredients','recipes','wastage','orders','loans','leaves','shifts'];
  keys.forEach(function(k,i){D[k]=Array.isArray(results[i])?results[i]:[];});
  console.log('[ArroyoDash] Data loaded - sales:',D.sales.length,'expenses:',D.expenses.length,'products:',D.products.length);
  UI.loading=false;
  await loadSettingsFromCloud();
  _loadDataBusy=false;
  /* render() rebuilds the sidebar, and the fresh dashSyncLbl starts out
     reading plain "Synced" — so the status has to be written after the
     rebuild, not before it, or the timestamp is thrown away immediately. */
  render();
  updateSyncStatus('idle','Synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
}

async function loadSettingsFromCloud(){
  if(!SESSION.token||!SESSION.bizId)return;
  try{
    const data=await api('/rest/v1/businesses?id=eq.'+SESSION.bizId);
    if(!data||!data[0]||!data[0].settings)return;
    const settings=typeof data[0].settings==='string'?JSON.parse(data[0].settings):data[0].settings;
    // Sync biz name
    if(settings.biz_name&&settings.biz_name!==SESSION.bizName){
      SESSION.bizName=settings.biz_name;
      saveSession();
    }
    // Store settings in SESSION for use in render
    SESSION.settings=settings;
  }catch(e){}
}

async function saveSettingsToCloud(patch){
  if(!SESSION.token||!SESSION.bizId)return;
  try{
    // Read current settings first
    const data=await api('/rest/v1/businesses?id=eq.'+SESSION.bizId);
    let current={};
    if(data&&data[0]&&data[0].settings){
      current=typeof data[0].settings==='string'?JSON.parse(data[0].settings):data[0].settings;
    }
    const merged=Object.assign({},current,patch);
    await api('/rest/v1/businesses?id=eq.'+SESSION.bizId,{
      method:'PATCH',
      headers:{'Prefer':'return=representation'},
      body:JSON.stringify({settings:JSON.stringify(merged),name:merged.biz_name||SESSION.bizName})
    });
    SESSION.bizName=merged.biz_name||SESSION.bizName;
    SESSION.settings=merged;
    saveSession();
  }catch(e){}
}

function filteredSales(){
  const now=new Date();
  return D.sales.filter(function(s){
    if(s.voided)return false;
    const d=new Date(s.date);
    if(UI.filter==='today')return d.toDateString()===now.toDateString();
    if(UI.filter==='week'){const w=new Date(now);w.setDate(w.getDate()-7);return d>=w;}
    if(UI.filter==='month'){const m=new Date(now);m.setDate(m.getDate()-30);return d>=m;}
    return true;
  });
}
function filteredExp(){
  const now=new Date();
  return D.expenses.filter(function(e){
    const d=new Date(e.date);
    if(UI.filter==='today')return d.toDateString()===now.toDateString();
    if(UI.filter==='week'){const w=new Date(now);w.setDate(w.getDate()-7);return d>=w;}
    if(UI.filter==='month'){const m=new Date(now);m.setDate(m.getDate()-30);return d>=m;}
    return true;
  });
}
function topProds(){
  const map={};
  D.sales.filter(function(s){return!s.voided;}).forEach(function(s){
    (s.items||[]).forEach(function(it){
      if(!map[it.name])map[it.name]={name:it.name,qty:0,rev:0};
      map[it.name].qty+=(it.qty||1);map[it.name].rev+=(it.price||0)*(it.qty||1);
    });
  });
  return Object.values(map).sort(function(a,b){return b.rev-a.rev;}).slice(0,8);
}
function salesByDay(){
  const map={};
  filteredSales().forEach(function(s){
    const k=new Date(s.date).toLocaleDateString('en-PH',{month:'short',day:'numeric'});
    map[k]=(map[k]||0)+s.total;
  });
  const days=Object.keys(map);
  return{labels:days,data:days.map(function(k){return map[k];})};
}

function mfField(box,id,lbl,type,val,ph,opts){
  const mf=el('div','mf','<label>'+lbl+'</label>');
  let inp;
  if(type==='select'){
    inp=document.createElement('select');inp.id=id;
    (opts||[]).forEach(function(o){const op=document.createElement('option');op.value=o.v;op.textContent=o.l;if(o.v==val)op.selected=true;inp.appendChild(op);});
  } else if(type==='textarea'){
    inp=document.createElement('textarea');inp.id=id;inp.placeholder=ph||'';inp.value=val||'';
  } else {
    inp=document.createElement('input');inp.type=type||'text';inp.id=id;inp.value=val||'';inp.placeholder=ph||'';if(type==='number')inp.min='0';
  }
  mf.appendChild(inp);box.appendChild(mf);
}

  const s=el('button','pri',saveLabel||'Save');s.onclick=onSave;btns.appendChild(s);
  box.appendChild(btns);

  brand.appendChild(bn);card.appendChild(brand);

  const ef=el('div','auth-field','<label>Email</label>');const ei=document.createElement('input');ei.type='email';ei.placeholder='you@email.com';ei.id='dEm';ef.appendChild(ei);card.appendChild(ef);
  const pf=el('div','auth-field','<label>Password</label>');const pi=document.createElement('input');pi.type='password';pi.placeholder='Password';pi.id='dPw';pf.appendChild(pi);card.appendChild(pf);
  const err=el('div','auth-err','');err.id='dErr';card.appendChild(err);
  const btn=el('button','auth-btn','Sign in to dashboard');
  const fgt=document.createElement('button');
  fgt.type='button';fgt.textContent='Forgot password?';
  fgt.style.cssText='background:none;border:none;color:var(--t2);font-size:12.5px;text-decoration:underline;cursor:pointer;padding:8px 0;display:block;margin:6px auto 0';
  fgt.onclick=async function(){
    const em=(document.getElementById('dEm').value||'').trim();
    const e2=document.getElementById('dErr');
    if(!em){e2.textContent='Enter your email first, then tap Forgot password.';return;}
    fgt.disabled=true;fgt.textContent='Sending\u2026';
    try{await fetch(SB_URL+'/auth/v1/recover',{method:'POST',
      headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email:em})});}catch(e){}
    e2.style.color='var(--st)';
    e2.textContent='If that email has an account, a reset link is on its way. Check spam too.';
    fgt.textContent='Forgot password?';fgt.disabled=false;
  };
  btn.onclick=async function(){
    const email=document.getElementById('dEm').value.trim();
    const pw=document.getElementById('dPw').value;
    if(!email||!pw){document.getElementById('dErr').textContent='Enter email and password.';return;}
    btn.disabled=true;btn.textContent='Signing in...';
    const res=await signIn(email,pw);
    if(!res.access_token){document.getElementById('dErr').textContent=authErrText(res,'Sign in failed.');btn.disabled=false;btn.textContent='Sign in to dashboard';return;}
    // The refresh token MUST be stored — refreshDashSession() reads it, and
    // without it every access token silently dies after ~1 hour and each
    // later api() call 401s with no way back except a manual re-login.
    SESSION.token=res.access_token;SESSION.refresh=res.refresh_token||null;
    SESSION.user=res.user&&res.user.id;SESSION.email=email;SESSION.settings=SESSION.settings||{};
    // Smart biz finder on login
    const loginHeaders={'apikey':SB_KEY,'Authorization':'Bearer '+res.access_token,'Content-Type':'application/json'};
    // First check if POS is open in the same browser - use its bizId directly
    let posBizId=null;
    try{const pc=JSON.parse(localStorage.getItem('arroyo_cloud')||'{}');if(pc&&pc.bizId)posBizId=pc.bizId;}catch(e){}
    let bizList=null;
    try{
      // FIX: res.user was read without a guard, so a token with no user object
      // threw instead of showing an error.
      const _uid=(res.user&&res.user.id)||'';
      const bizRes=await fetch(SB_URL+'/rest/v1/businesses?user_id=eq.'+_uid+'&order=created_at.asc',{headers:loginHeaders});
      if(bizRes.ok)bizList=await bizRes.json();
    }catch(e){}
    if(bizList&&bizList.length>0){
      let correctBiz=bizList[0];
      // Use POS bizId if it matches a known business record
      if(posBizId){
        const match=bizList.find(function(b){return b.id===posBizId;});
        if(match){correctBiz=match;}
      } else if(bizList.length>1){
        // Pick biz with most data
        let best=0;
        for(const b of bizList){
          let score=0;
          try{const sr=await fetch(SB_URL+'/rest/v1/sales?biz_id=eq.'+b.id+'&limit=1',{headers:loginHeaders});if(sr.ok){const sd=await sr.json();if(sd&&sd.length>0)score+=10;}}catch(e){}
          try{const er=await fetch(SB_URL+'/rest/v1/employees?biz_id=eq.'+b.id+'&limit=1',{headers:loginHeaders});if(er.ok){const ed=await er.json();if(ed&&ed.length>0)score+=5;}}catch(e){}
          if(score>best){best=score;correctBiz=b;}
        }
      }
      SESSION.bizId=correctBiz.id;SESSION.bizName=correctBiz.name;
    }
    console.log('[ArroyoDash] Login complete. bizId:',SESSION.bizId,'bizName:',SESSION.bizName);
    saveSession();
    scheduleDashTokenRefresh();
    await loadData();
  };
  pi.onkeydown=function(e){if(e.key==='Enter')btn.click();};
  card.appendChild(btn);card.appendChild(fgt);page.appendChild(card);root.appendChild(page);
  setTimeout(function(){const e=document.getElementById('dEm');if(e)e.focus();},100);
}

function calcCOGS(salesArr){
  // Calculate Cost of Goods Sold from recipes
  let cogs=0;
  salesArr.filter(function(s){return!s.voided;}).forEach(function(s){
    (s.items||[]).forEach(function(item){
      const recipes=D.recipes.filter(function(r){return r.product_name===item.name;});
      recipes.forEach(function(r){
        const ing=D.ingredients.find(function(i){return i.id===r.ingredient_id;});
        if(ing)cogs+=r.qty_used*(item.qty||1)*ingCost(ing);
      });
    });
  });
  return cogs;
}

  const cw=el('div','chart-wrap');const cv=document.createElement('canvas');cv.id='sChart';cw.appendChild(cv);cc.appendChild(cw);main.appendChild(cc);
  const two=el('div','two-col');
  const pm=el('div','card');pm.innerHTML='<div class="card-hd">Payment methods</div>';
  /* Card was withdrawn as a tender option in the POS, so it is no longer a

     including historic Card takings — so nothing drops out of the totals. */

}

function renderEmployees(main,fs){
  main.appendChild(el('div','page-title','Employees'));

  const now=new Date();
  const todayStr=now.toISOString().slice(0,10);
  const todayAtt=D.attendance.filter(function(a){return a.date===todayStr||new Date(a.date).toDateString()===now.toDateString();});
  const clockedInNow=todayAtt.filter(function(a){return a.time_in&&!a.time_out;}).length;
  const completedToday=todayAtt.filter(function(a){return a.time_in&&a.time_out;}).length;
  const totalHrsToday=todayAtt.reduce(function(a,r){return a+(r.hours_worked||0);},0);

  // Period attendance for stats
  const fAtt=D.attendance.filter(function(a){
    const d=new Date(a.date);
    if(UI.filter==='today')return d.toDateString()===now.toDateString();
    if(UI.filter==='week'){const w=new Date(now);w.setDate(w.getDate()-7);return d>=w;}
    if(UI.filter==='month'){const m=new Date(now);m.setDate(m.getDate()-30);return d>=m;}
    return true;
  });
  const totalHrs=fAtt.reduce(function(a,r){return a+(r.hours_worked||0);},0);

  // --- Stats row ---
  const sg=el('div','stats-grid');
  sg.appendChild(statCard('Team size',D.employees.length,'employees',''));
  sg.appendChild(statCard('On shift now',clockedInNow,'clocked in','green'));
  sg.appendChild(statCard('Hours today',totalHrsToday.toFixed(1)+'h','completed shifts','blue'));
  sg.appendChild(statCard('Active loans',D.loans.filter(function(l){return l.status==='active';}).length,'','amber'));
  main.appendChild(sg);

  // ============================================================
  // TODAY'S SHIFT BOARD
  // ============================================================
  const shiftCard=el('div','card');
  const shiftHd=el('div','shift-header');
  shiftHd.innerHTML='<div class="card-hd" style="margin:0">Today\'s Shift Board</div>'
    +'<div class="shift-date">'+now.toLocaleDateString('en-PH',{weekday:'long',month:'long',day:'numeric',year:'numeric'})+'</div>';
  shiftCard.appendChild(shiftHd);

  // Summary pills
  const sumRow=el('div','shift-summary');
  sumRow.innerHTML='<div class="shift-pill in"><span class="shift-dot"></span>'+clockedInNow+' On shift</div>'
    +'<div class="shift-pill out"><span class="shift-dot"></span>'+completedToday+' Completed</div>'
    +(D.employees.length-clockedInNow-completedToday>0?'<div class="shift-pill out"><span class="shift-dot"></span>'+(D.employees.length-clockedInNow-completedToday)+' Not in yet</div>':'')
    +'<div class="shift-pill total"><i class="ti ti-clock" style="font-size:12px"></i>'+totalHrsToday.toFixed(1)+'h total today</div>';
  shiftCard.appendChild(sumRow);

  if(!D.employees.length){
    shiftCard.appendChild(el('div','empty','No employees yet'));
  } else {
    // Sort: clocked-in first, then completed, then absent
    const sorted=D.employees.slice().sort(function(a,b){
      const aAtt=todayAtt.filter(function(x){return x.employee_id===a.id;});
      const bAtt=todayAtt.filter(function(x){return x.employee_id===b.id;});
      const aIn=aAtt.some(function(x){return x.time_in&&!x.time_out;});
      const bIn=bAtt.some(function(x){return x.time_in&&!x.time_out;});
      const aDone=aAtt.some(function(x){return x.time_in&&x.time_out;});
      const bDone=bAtt.some(function(x){return x.time_in&&x.time_out;});
      if(aIn&&!bIn)return -1;if(!aIn&&bIn)return 1;
      if(aDone&&!bDone)return -1;if(!aDone&&bDone)return 1;
      return a.name.localeCompare(b.name);
    });

    sorted.forEach(function(e){
      const empAtt=todayAtt.filter(function(a){return a.employee_id===e.id;});
      const activeShift=empAtt.find(function(a){return a.time_in&&!a.time_out;});
      const lastShift=empAtt.filter(function(a){return a.time_in&&a.time_out;}).sort(function(a,b){return new Date(b.time_in)-new Date(a.time_in);})[0];
      const isClockedIn=!!activeShift;
      const hasDone=!!lastShift;

      const row=el('div','shift-row '+(isClockedIn?'clocked-in':'clocked-out'));
      const av=el('div','shift-av '+(isClockedIn?'in':'out'),(e.name||'?')[0].toUpperCase());
      const info=el('div','shift-info');
      const timesEl=el('div','shift-times');

      if(isClockedIn){
        const inTime=new Date(activeShift.time_in);
        const elapsed=Math.floor((now-inTime)/60000);
        const elapsedStr=elapsed>=60?(Math.floor(elapsed/60)+'h '+(elapsed%60)+'m'):elapsed+'m';
        timesEl.innerHTML='<div class="shift-time-in"><i class="ti ti-login"></i>'+ft(activeShift.time_in)+'</div>'
          +'<span class="shift-sep">&rarr;</span>'
          +'<span class="att-active-badge">&#9679; Active '+elapsedStr+'</span>';
      } else if(hasDone){
        timesEl.innerHTML='<div class="shift-time-in"><i class="ti ti-login"></i>'+ft(lastShift.time_in)+'</div>'
          +'<span class="shift-sep">&rarr;</span>'
          +'<div class="shift-time-out"><i class="ti ti-logout"></i>'+ft(lastShift.time_out)+'</div>';
      } else {
        timesEl.innerHTML='<span class="shift-noshow">No shift recorded today</span>';
      }

      // All shifts today (multiple clock-ins)
      const allShiftsToday=empAtt.filter(function(a){return a.time_in&&a.time_out;});
      const totalEmpHrs=empAtt.reduce(function(a,r){return a+(r.hours_worked||0);},0);

      info.innerHTML='<div class="shift-name">'+esc(e.name)+'</div><div class="shift-role">'+esc(e.role)+'</div>';
      info.appendChild(timesEl);
      if(allShiftsToday.length>1){
        const multi=el('div','shift-duration');multi.textContent=allShiftsToday.length+' shifts today';
        info.appendChild(multi);
      }

      const hrs=el('div','shift-hrs '+(isClockedIn?'active':hasDone?'done':'none'));
      if(isClockedIn){
        const elapsed=Math.floor((now-new Date(activeShift.time_in))/3600000*10)/10;
        hrs.textContent=elapsed.toFixed(1)+'h+';
      } else if(totalEmpHrs>0){
        hrs.textContent=totalEmpHrs.toFixed(1)+'h';
      } else {
        hrs.textContent='—';
      }

      // Click to view employee's full att history
      row.style.cursor='pointer';
      row.onclick=function(){UI.modal={type:'empAtt',item:e};render();};
      row.appendChild(av);row.appendChild(info);row.appendChild(hrs);
      shiftCard.appendChild(row);
    });

    const hint=el('div','');
    hint.style.cssText='font-size:11px;color:var(--t3);text-align:center;padding:8px 0 0;';
    hint.textContent='Tap any employee to view their full attendance history';
    shiftCard.appendChild(hint);
  }
  main.appendChild(shiftCard);

  // ============================================================
  // EMPLOYEE LIST (manage)
  // ============================================================
  const empSec=el('div','card');
  const empHd=el('div','card-hd','Team');
  empHd.appendChild(addBtn('+ Add employee',function(){UI.modal={type:'emp',item:null};render();}));
  empSec.appendChild(empHd);

  if(!D.employees.length){
    empSec.appendChild(el('div','empty','No employees yet — add your first one'));
  } else {
    const grid=el('div','emp-grid');
    D.employees.forEach(function(e){
      const empAtt=todayAtt.filter(function(a){return a.employee_id===e.id;});
      const isClockedIn=empAtt.some(function(a){return a.time_in&&!a.time_out;});
      const activeShift=empAtt.find(function(a){return a.time_in&&!a.time_out;});
      const payLabel=e.pay_type==='hourly'?'PHP '+e.rate+'/hr'
        :e.pay_type==='daily'?'PHP '+e.rate+'/day'
        :e.pay_type==='monthly'?'PHP '+Number(e.rate).toLocaleString()+'/mo'
        :e.commission_pct+'% commission';

      const card=el('div','emp-card2');
      const head=el('div','emp-head');
      const av=el('div','emp-av2',(e.name||'?')[0].toUpperCase());
      const meta=el('div','emp-meta');
      meta.innerHTML='<div class="emp-name2">'+esc(e.name)+'</div>'
        +'<div class="emp-role2">'
        +'<span class="emp-status-dot '+(isClockedIn?'in':'out')+'"></span>'
        +'<span style="font-size:11px;color:var(--t3)">'+e.role+'</span>'
        +(isClockedIn&&activeShift?'<span style="font-size:10px;font-weight:700;color:var(--st);background:rgba(63,185,80,0.1);padding:1px 7px;border-radius:20px;border:1px solid rgba(63,185,80,0.2)">IN '+ft(activeShift.time_in)+'</span>':'')
        +'</div>';
      head.appendChild(av);head.appendChild(meta);
      const pay=el('div','emp-pay2',payLabel);
      const actions=el('div','emp-actions');
      function smBtn(lbl,fn){const b=el('button','sm-btn',lbl);b.onclick=fn;return b;}
      actions.appendChild(smBtn('History',function(){UI.modal={type:'empAtt',item:e};render();}));
      actions.appendChild(smBtn('Payslip',function(){UI.modal={type:'payslip',item:e};render();}));
      actions.appendChild(smBtn('Loan',function(){UI.modal={type:'loan',item:null,emp:e};render();}));
      actions.appendChild(smBtn('Edit',function(){UI.modal={type:'emp',item:e};render();}));
      card.appendChild(head);card.appendChild(pay);card.appendChild(actions);
      grid.appendChild(card);
    });
    empSec.appendChild(grid);
  }
  main.appendChild(empSec);

  // ============================================================
  // ATTENDANCE HISTORY (period)
  // ============================================================
  main.appendChild(filterBar());
  const attSec=el('div','card');
  const attHd=el('div','card-hd');
  attHd.innerHTML='Attendance history <span>'+fAtt.length+' records · '+totalHrs.toFixed(1)+'h total</span>';
  attSec.appendChild(attHd);

  if(!fAtt.length){
    attSec.appendChild(el('div','empty','No attendance records for this period'));
  } else {
    // Group by date descending
    const byDate={};
    fAtt.forEach(function(a){
      const k=new Date(a.date).toDateString();
      if(!byDate[k])byDate[k]=[];
      byDate[k].push(a);
    });
    const dateKeys=Object.keys(byDate).sort(function(a,b){return new Date(b)-new Date(a);});
    dateKeys.slice(0,14).forEach(function(dateStr){
      const records=byDate[dateStr];
      const y=new Date(now);y.setDate(y.getDate()-1);
      const lbl=dateStr===now.toDateString()?'Today'
        :dateStr===y.toDateString()?'Yesterday'
        :new Date(dateStr).toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric'});
      const dayHrs=records.reduce(function(a,r){return a+(r.hours_worked||0);},0);
      const dayGroup=el('div','att-day-group');
      const dayLbl=el('div','att-day-label');
      dayLbl.innerHTML=lbl
        +'<span style="font-size:11px;color:var(--ac);font-weight:600;letter-spacing:0">'+(dayHrs>0?dayHrs.toFixed(1)+'h':'')+'</span>';
      dayGroup.appendChild(dayLbl);
      records.sort(function(a,b){return new Date(a.time_in)-new Date(b.time_in);}).forEach(function(a){
        const isActive=a.time_in&&!a.time_out;
        const row=el('div','att-row2');
        const avatar=el('div','att-avatar',(a.employee_name||'?')[0].toUpperCase());
        const info=el('div','att-info');
        const times=el('div','att-times');
        if(a.time_in){times.innerHTML+='<div class="att-time-block"><i class="ti ti-login" style="color:var(--st)"></i><span>'+ft(a.time_in)+'</span></div>';}
        if(a.time_in){times.innerHTML+='<span class="att-arrow">&rarr;</span>';}

/* ==================================================================== *
 * CASH DRAWER
 *
 * Reads the `shifts` table the POS writes on check-out. Negative variance is
 * short, positive is over, and a NULL counted_cash means the drawer was never
 * counted at all — which is reported as its own state rather than being
 * folded in as a zero, because "nobody counted" and "counted and balanced"
 * are very different facts about a shift.
 * ==================================================================== */
function dashEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function renderShifts(main){
  main.appendChild(el('div','page-title','Cash drawer'));

  const all=(D.shifts||[]).slice();
  if(!all.length){
    const c0=el('div','card');
    c0.innerHTML='<div class="card-hd">Shifts</div>';
    c0.appendChild(el('div','empty','No shifts recorded yet. A shift appears here once a cashier checks out and counts the drawer in the POS.'));
    main.appendChild(c0);
    return;
  }

  const counted=all.filter(function(x){return x.counted_cash!==null&&x.counted_cash!==undefined;});
  const uncounted=all.filter(function(x){return x.counted_cash===null||x.counted_cash===undefined;});
  const shortOnes=counted.filter(function(x){return (+x.variance||0)<-0.005;});
  const overOnes=counted.filter(function(x){return (+x.variance||0)>0.005;});
  const netVar=counted.reduce(function(a,x){return a+(+x.variance||0);},0);
  const absVar=counted.reduce(function(a,x){return a+Math.abs(+x.variance||0);},0);

  const sg=el('div','stats-grid');
  sg.appendChild(statCard('Shifts',all.length,counted.length+' counted',''));
  sg.appendChild(statCard('Times short',shortOnes.length,'',shortOnes.length?'red':'green'));
  sg.appendChild(statCard('Times over',overOnes.length,'',overOnes.length?'amber':'green'));
  /* Net is what the till is actually out by overall; total discrepancy is the
     sum of the absolute gaps, which is the number that matters for spotting a
     cashier whose shorts and overs cancel out on paper. */
  sg.appendChild(statCard('Net variance',fmt(netVar),'across counted shifts',Math.abs(netVar)<0.005?'green':(netVar<0?'red':'amber')));
  sg.appendChild(statCard('Total discrepancy',fmt(absVar),'shorts + overs',absVar>0?'amber':'green'));
  sg.appendChild(statCard('Never counted',uncounted.length,'no cash count',uncounted.length?'red':'green'));
  main.appendChild(sg);

  if(uncounted.length){
    const warn=el('div','card');
    warn.innerHTML='<div class="card-hd">Drawers that were never counted <span>'+uncounted.length+'</span></div>';
    const w=el('div','');
    w.style.cssText='font-size:13px;color:var(--t3);line-height:1.6;margin-bottom:8px';
    w.textContent='These shifts closed without a cash count, so no short or over can be worked out for them. Usually it means the cashier was removed or deactivated mid-shift.';
    warn.appendChild(w);
    uncounted.slice(0,10).forEach(function(x){
      const r=el('div','row');
      r.innerHTML='<div class="row-l"><div class="row-name">'+dashEsc(x.cashier||'—')+'</div>'
        +'<div class="row-sub">'+fd(x.started_at)+' · float '+fmt(x.opening_float)+'</div></div>'
        +'<div class="row-r"><span class="badge b-gray">Not counted</span></div>';
      warn.appendChild(r);
    });
    main.appendChild(warn);
  }

  // Per-cashier roll-up, worst total discrepancy first.
  const byCashier={};
  counted.forEach(function(x){
    const k=x.cashier||'—';
    if(!byCashier[k])byCashier[k]={shifts:0,short:0,over:0,net:0,abs:0,sales:0};
    const b=byCashier[k];
    b.shifts++;b.net+=(+x.variance||0);b.abs+=Math.abs(+x.variance||0);
    b.sales+=(+x.cash_sales||0);
    if((+x.variance||0)<-0.005)b.short++;
    else if((+x.variance||0)>0.005)b.over++;
  });
  const cashierRows=Object.keys(byCashier).map(function(k){return[k,byCashier[k]];})
    .sort(function(a,b){return b[1].abs-a[1].abs;});

  if(cashierRows.length){
    const cc=el('div','card');
    cc.innerHTML='<div class="card-hd">By cashier <span>counted shifts only</span></div>';
    const tbl=el('table','tbl','<thead><tr><th>Cashier</th><th style="text-align:right">Shifts</th>'
      +'<th style="text-align:right">Short</th><th style="text-align:right">Over</th>'
      +'<th style="text-align:right">Net</th><th style="text-align:right">Discrepancy</th></tr></thead>');
    const tb=document.createElement('tbody');
    cashierRows.forEach(function(e){
      const k=e[0],b=e[1];
      const tr=document.createElement('tr');
      const netCol=Math.abs(b.net)<0.005?'var(--t3)':(b.net<0?'var(--dt)':'var(--wt)');
      tr.innerHTML='<td style="font-weight:600">'+dashEsc(k)+'</td>'
        +'<td style="text-align:right">'+b.shifts+'</td>'
        +'<td style="text-align:right;color:'+(b.short?'var(--dt)':'var(--t3)')+'">'+b.short+'</td>'
        +'<td style="text-align:right;color:'+(b.over?'var(--wt)':'var(--t3)')+'">'+b.over+'</td>'
        +'<td style="text-align:right;font-weight:700;color:'+netCol+'">'+fmt(b.net)+'</td>'
        +'<td style="text-align:right;font-weight:700">'+fmt(b.abs)+'</td>';
      tb.appendChild(tr);
    });
    tbl.appendChild(tb);cc.appendChild(tbl);main.appendChild(cc);
  }

  // Full shift list.
  const c=el('div','card');
  const hd=el('div','card-hd');
  hd.innerHTML='Shifts <span>'+all.length+'</span>';
  const expBtn=el('button','add-btn','Export CSV');expBtn.style.marginLeft='auto';
  expBtn.onclick=function(){exportShiftsCSV(all);};
  hd.appendChild(expBtn);c.appendChild(hd);

  const tbl2=el('table','tbl','<thead><tr><th>Cashier</th><th>Started</th><th>Ended</th>'
    +'<th style="text-align:right">Float</th><th style="text-align:right">Cash sales</th>'
    +'<th style="text-align:right">Paid out</th><th style="text-align:right">Expected</th>'
    +'<th style="text-align:right">Counted</th><th style="text-align:right">Short / Over</th></tr></thead>');
  const tb2=document.createElement('tbody');
  all.slice(0,150).forEach(function(x){
    const notCounted=x.counted_cash===null||x.counted_cash===undefined;
    const v=+x.variance||0;
    let badge,vtxt;
    if(notCounted){badge='b-gray';vtxt='Not counted';}
    else if(Math.abs(v)<0.005){badge='b-green';vtxt='Balanced';}
    else if(v<0){badge='b-red';vtxt='Short '+fmt(Math.abs(v));}
    else{badge='b-amber';vtxt='Over '+fmt(v);}
    const tr=document.createElement('tr');
    tr.innerHTML='<td style="font-weight:600">'+dashEsc(x.cashier||'—')+'</td>'
      +'<td style="white-space:nowrap;font-size:12px">'+fd(x.started_at)+' '+ft(x.started_at)+'</td>'
      +'<td style="white-space:nowrap;font-size:12px">'+(x.ended_at?ft(x.ended_at):'—')+'</td>'
      +'<td style="text-align:right">'+fmt(x.opening_float)+'</td>'
      +'<td style="text-align:right">'+fmt(x.cash_sales)+'</td>'
      +'<td style="text-align:right">'+fmt(x.paid_out)+'</td>'
      +'<td style="text-align:right">'+fmt(x.expected_cash)+'</td>'
      +'<td style="text-align:right">'+(notCounted?'—':fmt(x.counted_cash))+'</td>'
      +'<td style="text-align:right"><span class="badge '+badge+'">'+vtxt+'</span></td>';
    tb2.appendChild(tr);
  });
  tbl2.appendChild(tb2);c.appendChild(tbl2);main.appendChild(c);
}

function exportShiftsCSV(rows){
  const head=['Cashier','Started','Ended','Opening float','Cash sales','Paid out','Expected cash','Counted cash','Variance','Note'];
  // Quotes doubled and every field wrapped, so a note containing a comma
  // cannot shift the remaining columns along by one.
  const q=function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';};
  const lines=[head.map(q).join(',')];
  rows.forEach(function(x){
    lines.push([x.cashier||'',x.started_at||'',x.ended_at||'',
      (+x.opening_float||0).toFixed(2),(+x.cash_sales||0).toFixed(2),
      (+x.paid_out||0).toFixed(2),(+x.expected_cash||0).toFixed(2),
      (x.counted_cash===null||x.counted_cash===undefined)?'NOT COUNTED':(+x.counted_cash).toFixed(2),
      (+x.variance||0).toFixed(2),x.note||''].map(q).join(','));
  });
  const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='shifts-'+new Date().toISOString().slice(0,10)+'.csv';
  a.style.display='none';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
}

function renderRecipes(main){
  const hRow2=el('div','');hRow2.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:8px';
  hRow2.appendChild(el('div','page-title','Recipes'));

  syncRecBtn.onclick=async function(){syncRecBtn.textContent='Syncing...';syncRecBtn.disabled=true;await loadData();syncRecBtn.textContent='⟳ Sync from POS';syncRecBtn.disabled=false;};
  hRow2.appendChild(syncRecBtn);main.appendChild(hRow2);
  const prodWithRecipe=new Set(D.recipes.map(function(r){return r.product_name;})).size;

  // Calculate servings remaining per product (limited by the most constraining ingredient)
  function servingsRemaining(p){
    const recipes=D.recipes.filter(function(r){return r.product_name===p.name;});
    if(!recipes.length)return null;
    let min=Infinity;
    recipes.forEach(function(r){
      const ing=D.ingredients.find(function(i){return i.id===r.ingredient_id;});
      if(ing&&r.qty_used>0){const s=Math.floor(ing.stock/r.qty_used);if(s<min)min=s;}
    });
    return min===Infinity?null:min;
  }

  const sg=el('div','stats-grid');
  sg.appendChild(statCard('Products',D.products.length,'total',''));
  sg.appendChild(statCard('With recipes',prodWithRecipe,'linked','blue'));
  // Total servings possible across all products
  let totalServings=0;
  D.products.forEach(function(p){const s=servingsRemaining(p);if(s!==null)totalServings+=s;});
  sg.appendChild(statCard('Total servings',totalServings,'can still make','green'));
  sg.appendChild(statCard('No recipe',D.products.length-prodWithRecipe,'need setup','amber'));
  main.appendChild(sg);

  const note=el('div','');note.style.cssText='font-size:13px;color:var(--t2);margin-bottom:16px;padding:12px 14px;background:var(--bg2);border-radius:10px;line-height:1.6';
  note.textContent='Set up ingredients per product here. When a product is sold on the POS, its ingredients are automatically deducted from stock.';
  main.appendChild(note);

  D.products.forEach(function(p){
    const prodRecipes=D.recipes.filter(function(r){return r.product_name===p.name;});
    const servings=servingsRemaining(p);
    const card=el('div','card');
    const hd=el('div','card-hd');

    // Servings badge
    const servBadge=servings!==null?'<span class="badge '+(servings<=5?'b-red':servings<=20?'b-amber':'b-green')+'">'+servings+' servings left</span>':'<span class="badge b-gray">No recipe</span>';
    hd.innerHTML='<div><div style="font-size:15px;font-weight:700">'+esc(p.name)+' '+servBadge+'</div><div style="font-size:12px;color:var(--t3);margin-top:3px">'+esc(p.cat)+' · '+fmt(p.price)+'</div></div>';

    const addIngBtn=addBtn('+ Add ingredient',function(){UI.modal={type:'recipe',product:p,item:null};render();});
    hd.appendChild(addIngBtn);card.appendChild(hd);

    if(!prodRecipes.length){
      const empty=el('div','','No ingredients set — add ingredients to enable auto stock deduction');
      empty.style.cssText='font-size:12px;color:var(--t3);padding:8px 0';
      card.appendChild(empty);
    } else {
      // Cost per serving
      let costPerServing=0;
      prodRecipes.forEach(function(r){
        const ing=D.ingredients.find(function(i){return i.id===r.ingredient_id;});
        if(ing)costPerServing+=r.qty_used*ingCost(ing);
      });
      const margin=p.price-costPerServing;
      const marginPct=p.price>0?Math.round(margin/p.price*100):0;
      const summary=el('div','');
      summary.style.cssText='display:flex;gap:12px;flex-wrap:wrap;padding:8px 0 12px;border-bottom:1px solid var(--b1);margin-bottom:4px';
      summary.innerHTML='<div style="font-size:12px"><span style="color:var(--t3)">Cost/serving: </span><span style="font-weight:700;color:var(--dt)">'+fmt(costPerServing)+'</span></div>'+
        '<div style="font-size:12px"><span style="color:var(--t3)">Gross profit: </span><span style="font-weight:700;color:var(--st)">'+fmt(margin)+'</span></div>'+
        '<div style="font-size:12px"><span style="color:var(--t3)">Margin: </span><span style="font-weight:700;color:'+(marginPct>=50?'var(--st)':marginPct>=25?'var(--wt)':'var(--dt)')+'">'+marginPct+'%</span></div>';
      card.appendChild(summary);

      prodRecipes.forEach(function(r){
        const ing=D.ingredients.find(function(i){return i.id===r.ingredient_id;});
        const sLeft=ing&&r.qty_used>0?Math.floor(ing.stock/r.qty_used):0;

function renderIngredients(main){
  main.appendChild(el('div','page-title','Ingredients'));

  // Calculations
  const totalCostValue=D.ingredients.reduce(function(a,i){return a+i.stock*ingCost(i);},0);
  const low=D.ingredients.filter(function(i){return i.stock<=ingLow(i);}).length;
  const out=D.ingredients.filter(function(i){return i.stock<=0;}).length;

  // Daily consumption — based on last 7 days sales
  const now=new Date();const week=new Date(now);week.setDate(week.getDate()-7);
  const recentSales=D.sales.filter(function(s){return!s.voided&&new Date(s.date)>=week;});
  const dailyConsumption={};
  recentSales.forEach(function(s){
    (s.items||[]).forEach(function(item){
      const recipes=D.recipes.filter(function(r){return r.product_name===item.name;});
      recipes.forEach(function(r){
        dailyConsumption[r.ingredient_id]=(dailyConsumption[r.ingredient_id]||0)+(r.qty_used*(item.qty||1));
      });
    });
  });
  // Convert to daily avg (divide by 7)
  Object.keys(dailyConsumption).forEach(function(k){dailyConsumption[k]=dailyConsumption[k]/7;});

  // Days of stock remaining per ingredient
  const daysRemaining={};
  D.ingredients.forEach(function(i){
    const daily=dailyConsumption[i.id]||0;
    daysRemaining[i.id]=daily>0?Math.floor(i.stock/daily):null;
  });

  const sg=el('div','stats-grid');
  sg.appendChild(statCard('Ingredients',D.ingredients.length,'',''));
  sg.appendChild(statCard('Total cost value',fmt(totalCostValue),'in stock','blue'));
  sg.appendChild(statCard('Low stock',low,'need restocking',low>0?'red':'green'));
  sg.appendChild(statCard('Out of stock',out,'',out>0?'red':''));
  main.appendChild(sg);

  // Cost summary card
  const costCard=el('div','card');
  costCard.innerHTML='<div class="card-hd">Cost breakdown</div>';
  const costRows=[
    ['Total ingredient value',fmt(totalCostValue),''],
    ['Average cost per ingredient',D.ingredients.length?fmt(totalCostValue/D.ingredients.length):'PHP 0.00',''],
    ['Most expensive ingredient',(function(){const s=D.ingredients.slice().sort(function(a,b){return b.stock*ingCost(b)-a.stock*ingCost(a);});return s[0]?s[0].name+' ('+fmt(s[0].stock*ingCost(s[0]))+')':'None';})(),''],
  ];
  costRows.forEach(function(row){
    const r=el('div','payslip-row');
    r.innerHTML='<span>'+row[0]+'</span><span style="font-weight:600;color:var(--ac)">'+row[1]+'</span>';
    costCard.appendChild(r);
  });
  main.appendChild(costCard);

  // Stock list with days remaining
  const c=el('div','card');
  const hd=el('div','card-hd','Ingredient stock');hd.appendChild(addBtn('+ Add ingredient',function(){UI.modal={type:'ingredient',item:null};render();}));c.appendChild(hd);
  D.ingredients.sort(function(a,b){return a.stock-b.stock;}).forEach(function(ing){
    const isLow=ing.stock<=ingLow(ing);
    const days=daysRemaining[ing.id];
    const dailyUse=dailyConsumption[ing.id]||0;
    const r=el('div','row');
    const rl=el('div','row-l');
    let sub=ing.unit+' · PHP '+ingCost(ing)+'/unit · Value: '+fmt(ing.stock*ingCost(ing));
    if(dailyUse>0)sub+='<br><span style="color:'+(days&&days<=3?'var(--dt)':days&&days<=7?'var(--wt)':'var(--st)')+'">~'+dailyUse.toFixed(1)+ing.unit+'/day · '+(days!==null?days+' days left':'unlimited')+'</span>';
    else sub+='<br><span style="color:var(--t3)">No sales data yet</span>';
    rl.innerHTML='<div class="row-name">'+esc(ing.name)+'</div><div class="row-sub" style="line-height:1.6">'+sub+'</div>';
    const rr=el('div','row-r');
    const badge=el('span','badge '+(isLow?'b-amber':'b-green'),ing.stock+' '+(isLow?'⚠ low':'OK'));
    const editBtn=el('button','sm-btn','Edit');
    const ingId=ing.id;
    editBtn.onclick=function(){
      const found=D.ingredients.find(function(x){return x.id===ingId;});
      if(found){UI.modal={type:'ingredient',item:found};render();}
    };
    rr.appendChild(badge);rr.appendChild(editBtn);
    r.appendChild(rl);r.appendChild(rr);c.appendChild(r);
  });
  if(!D.ingredients.length)c.appendChild(el('div','empty','No ingredients yet'));
  main.appendChild(c);

  // Weekly consumption forecast
  if(Object.keys(dailyConsumption).length>0){
    const fc=el('div','card');
    fc.innerHTML='<div class="card-hd">Weekly consumption forecast <span>based on last 7 days</span></div>';
    D.ingredients.forEach(function(ing){
      const daily=dailyConsumption[ing.id]||0;
      if(!daily)return;
      const weekly=daily*7;const days=daysRemaining[ing.id];
      const pct=Math.min(ing.stock/Math.max(weekly,1)*100,100);
      const r=el('div','');r.style.cssText='padding:10px 0;border-bottom:1px solid var(--b1)';
      r.innerHTML='<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-size:13px;font-weight:600">'+esc(ing.name)+'</span><span style="font-size:12px;color:var(--t3)">'+weekly.toFixed(0)+esc(ing.unit)+'/week used</span></div>'+
        '<div style="height:6px;background:var(--bg3);border-radius:3px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+(pct<20?'var(--dt)':pct<50?'var(--wt)':'var(--ac)')+';border-radius:3px;transition:width .4s"></div></div>'+
        '<div style="display:flex;justify-content:space-between;margin-top:4px"><span style="font-size:11px;color:var(--t3)">'+ing.stock+ing.unit+' remaining</span><span style="font-size:11px;color:'+(days&&days<=7?'var(--dt)':'var(--t3)')+'">'+(days!==null?days+' days left':'No usage data')+'</span></div>';
      fc.appendChild(r);
    });
    main.appendChild(fc);
  }
}

function renderPnL(main,fs,fe,rev,exp,net){
  main.appendChild(el('div','page-title','Profit & Loss'));
  main.appendChild(filterBar());

  const cogs=calcCOGS(fs);
  const grossProfit=rev-cogs;
  const grossMargin=rev>0?Math.round(grossProfit/rev*100):0;
  const vat=rev/1.12*0.12;
  const netSales=rev-vat;
  const netProfit=rev-exp;
  const netMargin=rev>0?Math.round(netProfit/rev*100):0;
  const salaryExp=D.employees.filter(function(e){return e.pay_type==='monthly';}).reduce(function(a,e){return a+e.rate;},0);
  const wasteCost=D.wastage.reduce(function(a,w){return a+w.cost;},0);

  // Summary stats
  const sg=el('div','stats-grid');
  sg.appendChild(statCard('Gross profit',fmt(grossProfit),grossMargin+'% margin',grossProfit>=0?'green':'red'));
  sg.appendChild(statCard('Net profit',fmt(netProfit),netMargin+'% margin',netProfit>=0?'green':'red'));
  sg.appendChild(statCard('COGS',fmt(cogs),'ingredient costs','red'));
  sg.appendChild(statCard('Wastage cost',fmt(wasteCost),'losses','amber'));
  main.appendChild(sg);

  // Full P&L statement
  const pl=el('div','card');
  pl.innerHTML='<div class="card-hd">Profit & Loss Statement <span>'+UI.filter+'</span></div>';

  function plSection(title){
    const h=el('div','');h.style.cssText='font-size:10px;font-weight:800;color:var(--t3);text-transform:uppercase;letter-spacing:1px;padding:14px 0 6px;border-bottom:1px solid var(--b2);margin-top:4px';
    h.textContent=title;pl.appendChild(h);
  }
  function plRow(label,value,color,bold,indent){
    const r=el('div','');
    r.style.cssText='display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--b1)';
    r.innerHTML='<span style="font-size:13px;color:'+(color||'var(--t2)')+';font-weight:'+(bold?'700':'400')+';padding-left:'+(indent?'16px':'0')+'">'+label+'</span>'+
      '<span style="font-size:13px;font-weight:'+(bold?'800':'600')+';color:'+(color||'var(--t2)')+'">'+value+'</span>';
    pl.appendChild(r);
  }
  function plTotal(label,value,color){
    const r=el('div','');
    r.style.cssText='display:flex;justify-content:space-between;padding:12px 0;margin-top:2px;border-top:2px solid var(--b2)';
    r.innerHTML='<span style="font-size:15px;font-weight:800;color:'+(color||'var(--t1)')+'">'+label+'</span>'+
      '<span style="font-size:16px;font-weight:900;color:'+(color||'var(--t1)')+'">'+value+'</span>';
    pl.appendChild(r);
  }

  plSection('Revenue');
  plRow('Gross sales',fmt(rev),'var(--t1)',true);
  plRow('VAT (12%)',fmt(vat),'var(--t3)',false,true);
  plRow('Net sales (excl. VAT)',fmt(netSales),'var(--ac)',true);

  plSection('Cost of Goods Sold');
  plRow('Ingredient costs',fmt(cogs),'var(--t2)',false);
  plRow('Wastage / spoilage',fmt(wasteCost),'var(--wt)',false);
  plTotal('Gross Profit',fmt(grossProfit),grossProfit>=0?'var(--st)':'var(--dt)');
  const r1=el('div','');r1.style.cssText='font-size:11px;color:var(--t3);padding:4px 0 8px;text-align:right';r1.textContent='Gross margin: '+grossMargin+'%';pl.appendChild(r1);

  plSection('Operating Expenses');
  // Break down expenses by category
  const expByCat={};
  fe.forEach(function(e){expByCat[e.cat||'Other']=(expByCat[e.cat||'Other']||0)+e.amount;});
  Object.entries(expByCat).forEach(function(entry){plRow(entry[0],fmt(entry[1]),'var(--t2)',false,true);});
  if(salaryExp>0)plRow('Salaries (monthly staff)',fmt(salaryExp),'var(--t2)',false,true);
  plRow('Total operating expenses',fmt(exp+salaryExp),'var(--t2)',true);
  plTotal('Net Profit',fmt(netProfit),netProfit>=0?'var(--st)':'var(--dt)');
  const r2=el('div','');r2.style.cssText='font-size:11px;color:var(--t3);padding:4px 0 8px;text-align:right';r2.textContent='Net margin: '+netMargin+'%';pl.appendChild(r2);

  main.appendChild(pl);

  // Per product profitability
  const prodCard=el('div','card');
  prodCard.innerHTML='<div class="card-hd">Per product profitability</div>';
  const prodProfit=[];
  D.products.forEach(function(p){
    const recipes=D.recipes.filter(function(r){return r.product_name===p.name;});
    let cogs2=0;
    recipes.forEach(function(r){
      const ing=D.ingredients.find(function(i){return i.id===r.ingredient_id;});
      if(ing)cogs2+=r.qty_used*ingCost(ing);
    });
    const sold=fs.filter(function(s){return!s.voided;}).reduce(function(a,s){
      return a+(s.items||[]).filter(function(i){return i.name===p.name;}).reduce(function(b,i){return b+(i.qty||1);},0);
    },0);
    if(sold>0)prodProfit.push({name:p.name,price:p.price,cogs:cogs2,margin:p.price>0?Math.round((p.price-cogs2)/p.price*100):0,sold,totalProfit:(p.price-cogs2)*sold});
  });
  prodProfit.sort(function(a,b){return b.totalProfit-a.totalProfit;});
  if(!prodProfit.length){
    prodCard.appendChild(el('div','empty','No sales data yet — set up recipes to see per-product profit'));
  } else {
    prodProfit.forEach(function(p,i){
      const r=el('div','row');
      const rl=el('div','row-l');
      rl.innerHTML='<div class="row-name">'+(i+1)+'. '+esc(p.name)+'</div><div class="row-sub">Sold: '+p.sold+' · Cost/unit: '+fmt(p.cogs)+'</div>';
      const rr=el('div','row-r');
      rr.style.cssText='display:flex;flex-direction:column;align-items:flex-end;gap:3px';
      rr.innerHTML='<span style="font-weight:700;color:var(--st)">'+fmt(p.totalProfit)+'</span>'+
        '<span class="badge '+(p.margin>=50?'b-green':p.margin>=25?'b-amber':'b-red')+'">'+p.margin+'% margin</span>';
      r.appendChild(rl);r.appendChild(rr);prodCard.appendChild(r);
    });
  }
  main.appendChild(prodCard);
}

function renderModal(root){
  const m=UI.modal;if(!m)return;

  const box=el('div','modal');
  function close(){UI.modal=null;render();}
  function save(table,payload,id){
    const doSave=async function(){
      const r=id
        ?await api('/rest/v1/'+table+'?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(payload)})
        :await api('/rest/v1/'+table,{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(payload)});
      if(r===null){alert('Save failed. Check your connection.');return;}
      UI.modal=null;
      await loadData();
    };
    doSave();
  }
  function gv(id){return(document.getElementById(id)||{}).value||'';}

  if(m.type==='emp'){
    const it=m.item||{};const isNew=!m.item;
    box.appendChild(el('div','modal-title',isNew?'Add employee':'Edit employee'));
    mfField(box,'eName','Full name','text',it.name,'Employee name');
    mfField(box,'eRole','Role','select',it.role||'Staff','',[ {v:'Staff',l:'Staff'},{v:'Cashier',l:'Cashier'},{v:'Manager',l:'Manager'},{v:'Supervisor',l:'Supervisor'},{v:'Cook',l:'Cook'},{v:'Driver',l:'Driver'}]);

    mfField(box,'eRate','Rate (PHP or % for commission)','number',it.pay_type==='commission'?it.commission_pct:it.rate,'0');
    modalBtns(box,close,function(){
      const pt=gv('ePayType'),rate=parseFloat(gv('eRate'))||0;
      const p={biz_id:SESSION.bizId,name:gv('eName'),role:gv('eRole')||'Staff',phone:gv('ePhone'),pay_type:pt,rate:pt==='commission'?0:rate,commission_pct:pt==='commission'?rate:0,active:true};
      if(!p.name){alert('Enter name');return;}
      save('employees',p,it.id);
    /* close() used to sit outside the uiConfirm callback, so the edit modal

    },isNew?'Add':'Save',it.id?function(){uiConfirm('Remove '+it.name+'?',async function(__ok){
      if(!__ok){close();return;}

      UI.modal=null;await loadData();
    },{tone:'dang'});}:null);

  } else if(m.type==='empAtt'){
